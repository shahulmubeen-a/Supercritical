name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    env:
      # pygame needs a video driver even for tests that never open a window.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run black --check .

      - name: Tests
        run: uv run pytest

      - name: Smoke test the CLI
        run: |
          uv run supercritical --list-players
          uv run supercritical --headless --games 3 --rows 6 --cols 5 --seed 1 \
            --players loader,sentinel,greedy,random
